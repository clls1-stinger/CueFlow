name: Web tests and Cloudflare deployment
on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cueflow-web-${{ github.ref }}
  cancel-in-progress: true
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Prepare original media fixtures
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          npm run fixtures
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-test-results
          path: web/test-results
      - name: Deploy Pages and its Worker
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npm run deploy
      - name: Verify deployed source commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          node --input-type=module - <<'JS'
          let verified = false;
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch('https://cueflow.enriquepl.com/api/health');
              const health = await response.json();
              if (response.ok && health.commit === process.env.EXPECTED_SHA && health.uploads === false) {
                console.log(health); verified = true; break;
              }
            } catch { /* Allow the custom domain and deployment to propagate. */ }
            await new Promise(resolve => setTimeout(resolve, 5000));
          }
          if (!verified) throw new Error('Production source commit could not be verified');
          JS
