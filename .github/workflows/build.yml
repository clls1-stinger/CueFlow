name: Build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          - os: macos-14
            platform: macos-arm64
          - os: macos-15-intel
            platform: macos-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MACOSX_DEPLOYMENT_TARGET: '12.0'
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.11.22'
      - name: Python dependencies
        run: uv sync --frozen --python 3.12 --extra dev
      - name: Linux GUI libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 libxcb-cursor0
      - name: Windows compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make diffutils tar xz curl
      - uses: actions/cache@v4
        id: ffmpeg-cache
        with:
          path: vendor
          key: ffmpeg-${{ matrix.platform }}-${{ hashFiles('scripts/build_ffmpeg.sh') }}
      - name: Build FFmpeg (Unix)
        if: runner.os != 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: bash scripts/build_ffmpeg.sh
      - name: Build FFmpeg (Windows)
        if: runner.os == 'Windows' && steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: msys2 {0}
        run: bash scripts/build_ffmpeg.sh
      - name: Lint and tests
        run: |
          uv run ruff check cueflow tests scripts
          uv run pytest -q
      - name: Package desktop app
        run: |
          uv run python scripts/collect_licenses.py
          uv run pyinstaller --noconfirm --clean CueFlow.spec
      - name: Smoke test frozen app (Unix)
        if: runner.os != 'Windows'
        run: ./dist/CueFlow/CueFlow --self-test
      - name: Smoke test frozen app (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./dist/CueFlow/CueFlow.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Archive and checksum
        run: uv run python scripts/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: CueFlow-${{ matrix.platform }}
          path: |
            dist/CueFlow-1.0.0-*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.platform == 'linux-x64'
        with:
          name: ffmpeg-corresponding-source
          path: vendor/sources/ffmpeg-8.1.3.tar.xz
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Publish tested release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --title "CueFlow $GITHUB_REF_NAME" --notes-file docs/RELEASE.md
