[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "cueflow"
version = "1.1.0"
description = "Local, bilingual desktop subtitle synchronization powered by ffsubsync."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "MIT"
dependencies = [
  "PySide6>=6.8,<6.9",
  "ffsubsync==0.5.1",
  "ftfy>=6.3,<7",
  "psutil>=6,<8",
]

[project.scripts]
cueflow = "cueflow.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.12,<7", "pillow>=11,<12", "ruff>=0.11"]

[tool.setuptools.packages.find]
include = ["cueflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
